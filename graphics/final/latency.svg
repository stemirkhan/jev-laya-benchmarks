<title id="title">Время реранжирования 20 документов</title><desc id="desc">У каждой модели две полосы на общей шкале: сверху бирюзовая медиана P50, снизу песочная P95. Время полного списка, 2542 измерения на модель. У Jev учитывается сеть и API OpenRouter; четыре локальные модели работают на RTX 5090. Первичный поиск не включен.</desc>
